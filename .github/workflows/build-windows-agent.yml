name: Build Windows Agent

on:
  push:
    tags:
      - "v*"           # triggers on: git tag v1.0.1 && git push --tags
  workflow_dispatch:   # allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows-agent/package-lock.json

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            VERSION="1.0.0"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"
          # Patch version into package.json
          cd windows-agent
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          "

      - name: Install dependencies
        run: |
          cd windows-agent
          npm ci

      - name: Build Windows installer
        run: |
          cd windows-agent
          npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find installer
        shell: bash
        run: |
          INSTALLER=$(find windows-agent/dist -name "*.exe" | head -1)
          echo "INSTALLER=$INSTALLER" >> $GITHUB_ENV
          echo "Found: $INSTALLER"

      - name: Upload artifact (every build)
        uses: actions/upload-artifact@v4
        with:
          name: TeamMonitorAgent-Windows
          path: ${{ env.INSTALLER }}
          retention-days: 30

      - name: Create GitHub Release (on tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.INSTALLER }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
